<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>백마FC 매니지먼트 시스템</title>
  <style>
    /* ===== CSS Variables ===== */
    :root {
      --primary: #1a2a3a;
      --primary-light: #2c4a6a;
      --primary-dark: #0f1a2a;
      --accent: #e8a838;
      --accent-hover: #d4932a;
      --accent-light: #f5c542;
      --success: #2e7d32;
      --danger: #c62828;
      --warning: #f9a825;
      --info: #1565c0;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --text-light: #6b7280;
      --border: #e2e8f0;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
      --radius: 12px;
      --radius-sm: 8px;
      --transition: 0.25s ease;
      --sidebar-width: 260px;
      --header-height: 60px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      min-height: 100vh;
    }
    button {
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      transition: var(--transition);
    }
    input, select, textarea {
      font-family: inherit;
      font-size: 0.9rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.5rem 0.75rem;
      background: var(--card-bg);
      color: var(--text);
      transition: var(--transition);
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(44,74,106,0.1);
    }
    textarea { resize: vertical; min-height: 80px; }
    a { color: var(--primary-light); text-decoration: none; }

    /* ===== Scrollbar ===== */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* ===== Sidebar ===== */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--primary);
      color: #fff;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: transform var(--transition);
      box-shadow: 2px 0 12px rgba(0,0,0,0.1);
    }
    .sidebar-brand {
      padding: 1.25rem 1.25rem 0.75rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-height: 84px;
    }
    .sidebar-brand .logo-emblem {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      position: relative;
    }
    .sidebar-brand .logo-emblem svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .sidebar-brand .logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }
    .sidebar-brand .logo-text .club-name {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fff;
    }
    .sidebar-brand .logo-text .club-name span {
      color: var(--accent-light);
    }
    .sidebar-brand .logo-text .club-sub {
      font-size: 0.55rem;
      font-weight: 400;
      opacity: 0.6;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 1rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .sidebar-nav .nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 0.9rem;
      border-radius: var(--radius-sm);
      color: rgba(255,255,255,0.7);
      transition: var(--transition);
      font-size: 0.9rem;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .sidebar-nav .nav-item:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }
    .sidebar-nav .nav-item.active {
      background: var(--accent);
      color: var(--primary-dark);
      font-weight: 600;
    }
    .sidebar-nav .nav-item .nav-icon {
      width: 22px;
      text-align: center;
      font-size: 1.1rem;
    }

    .sidebar-footer {
      padding: 1rem 1.25rem;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 0.75rem;
      opacity: 0.6;
      text-align: center;
    }

    /* ===== Main Layout ===== */
    .main-wrapper {
      margin-left: var(--sidebar-width);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .main-header {
      height: var(--header-height);
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .main-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
    }
    .main-header .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .main-header .header-actions .badge {
      background: var(--primary-light);
      color: #fff;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
    }
    .mobile-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--primary);
      padding: 0.25rem;
    }

    .main-content {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
    }

    /* ===== Utility ===== */
    .container { max-width: 1320px; margin: 0 auto; }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
      border: 1px solid var(--border);
      transition: var(--transition);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .card-header h3 {
      font-size: 1.05rem;
      font-weight: 700;
    }
    .card-header .actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* ===== Buttons ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1.2rem;
      border-radius: var(--radius-sm);
      border: none;
      font-weight: 600;
      font-size: 0.85rem;
      transition: var(--transition);
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--primary-light);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary); }
    .btn-accent {
      background: var(--accent);
      color: var(--primary-dark);
    }
    .btn-accent:hover { background: var(--accent-hover); }
    .btn-success {
      background: var(--success);
      color: #fff;
    }
    .btn-success:hover { background: #1b5e20; }
    .btn-danger {
      background: var(--danger);
      color: #fff;
    }
    .btn-danger:hover { background: #b71c1c; }
    .btn-sm {
      padding: 0.3rem 0.8rem;
      font-size: 0.8rem;
    }
    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover { border-color: var(--primary-light); }
    .btn-warning {
      background: var(--warning);
      color: var(--primary-dark);
    }
    .btn-warning:hover { background: #e0a800; }
    .btn-ghost {
      background: transparent;
      color: var(--text-light);
      padding: 0.3rem 0.6rem;
    }
    .btn-ghost:hover { background: var(--bg); }

    /* ===== Tables ===== */
    .table-wrap {
      overflow-x: auto;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    table th {
      background: var(--primary);
      color: #fff;
      padding: 0.75rem 1rem;
      text-align: left;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    table td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    table tr:hover td { background: #f8fafc; }
    table .status {
      display: inline-block;
      padding: 0.15rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-active { background: #e8f5e9; color: var(--success); }
    .status-injured { background: #fff3e0; color: #e65100; }
    .status-retired { background: #f5f5f5; color: var(--text-light); }
    .status-inactive { background: #e0e7ff; color: var(--info); }
    .status-playing { background: #e0f2f1; color: #00796b; }

    /* ===== Forms ===== */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    .form-grid .full-width { grid-column: 1 / -1; }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-light);
    }
    .form-group input, .form-group select { width: 100%; }

    /* ===== Modal ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      max-width: 560px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.5rem;
      animation: modalIn 0.25s ease;
    }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .modal h3 {
      margin-bottom: 1rem;
      font-size: 1.1rem;
      color: var(--primary);
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    /* ===== Stats Grid ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--card-bg);
      border-radius: var(--radius-sm);
      padding: 1.25rem;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      text-align: center;
      transition: var(--transition);
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
    .stat-card .stat-number {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
    }
    .stat-card .stat-label {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-top: 0.25rem;
      font-weight: 500;
    }

    /* ===== Player Card ===== */
    .player-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }
    .player-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }
    .player-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .player-card .player-avatar {
      width: 100%;
      height: 160px;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 700;
      color: rgba(255,255,255,0.8);
      position: relative;
    }
    .player-card .player-avatar .position-badge {
      position: absolute;
      bottom: 0.75rem;
      right: 0.75rem;
      background: var(--accent);
      color: var(--primary-dark);
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .player-card .player-body {
      padding: 1rem 1.25rem 1.25rem;
    }
    .player-card .player-body h4 {
      font-size: 1.05rem;
      font-weight: 700;
    }
    .player-card .player-body .player-info {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: var(--text-light);
    }
    .player-card .player-body .player-info span { display: flex; align-items: center; gap: 0.3rem; }
    .player-card .player-actions {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    /* ===== Match Lineup ===== */
    .lineup-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .lineup-spot {
      background: #f8fafc;
      border-radius: var(--radius-sm);
      border: 2px dashed var(--border);
      padding: 0.75rem;
      text-align: center;
      transition: var(--transition);
    }
    .lineup-spot.assigned {
      border-color: var(--primary-light);
      background: #ebf4ff;
    }
    .lineup-spot .player-name {
      font-weight: 600;
      font-size: 0.9rem;
    }
    .lineup-spot .position-label {
      font-size: 0.7rem;
      color: var(--text-light);
      margin-top: 0.2rem;
    }
    .lineup-spot .lineup-actions {
      margin-top: 0.5rem;
      display: flex;
      gap: 0.3rem;
      justify-content: center;
    }

    /* ===== Position Indicators ===== */
    .position-tags {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .position-tag {
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--bg);
      color: var(--text-light);
    }
    .pos-GK { background: #c8e6c9; color: #1b5e20; }
    .pos-DF { background: #bbdefb; color: #1565c0; }
    .pos-MF { background: #e1bee7; color: #6a1b9a; }
    .pos-FW { background: #fff3e0; color: #e65100; }

    /* ===== Empty State ===== */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-light);
    }
    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 0.75rem; opacity: 0.5; }
    .empty-state p { font-size: 0.95rem; }

    /* ===== Match List ===== */
    .match-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      gap: 1rem;
    }
    .match-list-item:last-child { border-bottom: none; }
    .match-list-item .match-info {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex: 1;
      min-width: 0;
    }
    .match-list-item .match-info .date {
      font-size: 0.8rem;
      color: var(--text-light);
      white-space: nowrap;
    }
    .match-list-item .match-info .vs {
      font-weight: 700;
      color: var(--primary);
    }
    .match-list-item .match-status {
      font-size: 0.75rem;
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      font-weight: 600;
    }
    .match-list-item .match-actions {
      display: flex;
      gap: 0.4rem;
    }

    /* ===== Toast ===== */
    .toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-width: 360px;
    }
    .toast {
      background: var(--primary);
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-sm);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      font-size: 0.9rem;
      animation: toastIn 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    .toast.warning { background: var(--warning); color: var(--primary-dark); }
    @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-wrapper { margin-left: 0; }
      .main-header { padding: 0 1rem; }
      .main-content { padding: 1rem; }
      .mobile-toggle { display: block; }
      .form-grid { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .player-grid { grid-template-columns: 1fr; }
      .lineup-container { grid-template-columns: repeat(2, 1fr); }
      .modal { max-width: 95vw; padding: 1rem; }
      .toast-container { left: 1rem; right: 1rem; bottom: 1rem; max-width: none; }
      .match-list-item { flex-wrap: wrap; }
    }
    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr; }
      .lineup-container { grid-template-columns: 1fr; }
      .main-header .header-actions .badge { display: none; }
    }

    /* ===== Misc ===== */
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .flex-center { display: flex; align-items: center; gap: 0.5rem; }
    .gap-1 { gap: 0.5rem; }
    .gap-2 { gap: 1rem; }
    .mt-1 { margin-top: 0.75rem; }
    .mt-2 { margin-top: 1.5rem; }
    .mb-1 { margin-bottom: 0.75rem; }
    .text-center { text-align: center; }
    .text-light { color: var(--text-light); }
    .text-muted { font-size: 0.85rem; }
    .hidden { display: none !important; }

    /* ===== Match Detail - Field Layout ===== */
    .field-grid {
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      gap: 4px;
      margin: 1rem 0;
      position: relative;
    }
    .field-grid .empty-cell {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: var(--text-light);
    }
    .field-grid .player-cell {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.5rem 0.4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      background: #f8fafc;
      min-height: 50px;
    }
    .field-grid .player-cell .p-name { font-weight: 600; font-size: 0.8rem; }
    .field-grid .player-cell .p-num { font-size: 0.7rem; color: var(--text-light); }
    .field-grid .player-cell .p-pos { font-size: 0.6rem; font-weight: 600; padding: 0.1rem 0.4rem; border-radius: 4px; }
    .field-grid .player-cell .p-actions { margin-top: 0.25rem; display: flex; gap: 0.2rem; justify-content: center; }
    .field-grid .player-cell .p-actions button { font-size: 0.6rem; padding: 0.1rem 0.4rem; }
    .field-grid .player-cell .p-pos.pos-GK { background: #c8e6c9; color: #1b5e20; }
    .field-grid .player-cell .p-pos.pos-DF { background: #bbdefb; color: #1565c0; }
    .field-grid .player-cell .p-pos.pos-MF { background: #e1bee7; color: #6a1b9a; }
    .field-grid .player-cell .p-pos.pos-FW { background: #fff3e0; color: #e65100; }
  </style>
</head>
<body>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="logo-emblem">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="백마FC 엠블럼">
          <!-- Shield background -->
          <defs>
            <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1a2a3a"/>
              <stop offset="100%" stop-color="#0f1a2a"/>
            </linearGradient>
            <linearGradient id="horseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f5c542"/>
              <stop offset="100%" stop-color="#e8a838"/>
            </linearGradient>
            <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="40%" stop-color="#f0f0f0"/>
              <stop offset="100%" stop-color="#ffffff"/>
            </linearGradient>
            <radialGradient id="ballShadow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
            </radialGradient>
            <filter id="shadow">
              <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.15"/>
            </filter>
          </defs>

          <!-- Shield shape -->
          <path d="M50 8 C62 8 74 18 74 32 C74 50 62 68 50 68 C38 68 26 50 26 32 C26 18 38 8 50 8Z"
                fill="url(#shieldGrad)" stroke="#2c4a6a" stroke-width="2"/>
          <!-- Decorative inner border -->
          <path d="M50 14 C60 14 70 24 70 36 C70 52 60 66 50 66 C40 66 30 52 30 36 C30 24 40 14 50 14Z"
                fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

          <!-- Horse silhouette -->
          <g transform="translate(50, 38) scale(1.1)">
            <!-- Horse body -->
            <path d="M-18 -8 C-18 0 -16 8 -12 8 L-8 10 L2 10 L4 8 L8 8 C8 4 10 -4 10 -8 L16 -14 Z"
                  fill="url(#horseGrad)" filter="url(#shadow)"/>
            <!-- Horse neck -->
            <path d="M-4 -8 C-4 -18 2 -24 10 -20"
                  fill="url(#horseGrad)" filter="url(#shadow)"/>
            <!-- Horse head -->
            <circle cx="18" cy="-14" r="5" fill="url(#horseGrad)" filter="url(#shadow)"/>
            <circle cx="19" cy="-15" r="1" fill="#fff" opacity="0.3"/>
            <!-- Horse mane -->
            <path d="M-4 -8 Q-8 -20 2 -18" stroke="#d4932a" stroke-width="1.5" fill="none" opacity="0.6"/>
            <path d="M-6 -2 Q-10 -18 -2 -14" stroke="#d4932a" stroke-width="1.5" fill="none" opacity="0.5"/>
            <!-- Horse tail -->
            <path d="M-10 8 Q-16 14 -12 12" stroke="#d4932a" stroke-width="1.5" fill="none" opacity="0.5"/>
            <!-- Horse leg - front -->
            <rect x="-14" y="0" width="3" height="14" rx="1" fill="#d4932a" opacity="0.8"/>
            <!-- Horse leg - hind -->
            <rect x="-4" y="2" width="3" height="12" rx="1" fill="#d4932a" opacity="0.7"/>
            <!-- Saddle -->
            <path d="M-6 -4 C-6 -10 4 -10 6 -4 Z" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
            <!-- Saddle strap -->
            <path d="M-6 -4 L6 -4" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
          </g>

          <!-- Football (soccer ball) -->
          <g transform="translate(68, 48) scale(0.9)">
            <circle cx="0" cy="0" r="10" fill="url(#ballGrad)" filter="url(#shadow)"/>
            <!-- Ball pattern - pentagon -->
            <polygon points="-3,-10 5,-3.5 3,1 -5,1 -2,-4" fill="rgba(0,0,0,0.08)" stroke="rgba(0,0,0,0.12)" stroke-width="0.5"/>
            <polygon points="3,-10 -5,-3.5 -3,1 5,1 2,-4" fill="rgba(0,0,0,0.08)" stroke="rgba(0,0,0,0.12)" stroke-width="0.5"/>
            <!-- Cross seams -->
            <line x1="-10" y1="0" x2="10" y2="0" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
            <line x1="0" y1="-10" x2="0" y2="10" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
          </g>

          <!-- Shield bottom accent line -->
          <line x1="26" y1="36" x2="74" y2="36" stroke="var(--accent)" stroke-width="1.5" opacity="0.4"/>

          <!-- "백마" text along shield -->
          <text x="50" y="19" text-anchor="middle" fill="var(--accent-light)"
                font-family="'Segoe UI', system-ui, sans-serif" font-weight="800"
                font-size="11" letter-spacing="2">백마FC</text>
          <text x="50" y="26" text-anchor="middle" fill="rgba(255,255,255,0.5)"
                font-family="'Segoe UI', system-ui, sans-serif" font-weight="400"
                font-size="7" letter-spacing="3">FOOTBALL CLUB</text>
        </svg>
      </div>
      <div class="logo-text">
        <div class="club-name">백마<span>FC</span></div>
        <div class="club-sub">축구클럽 관리 시스템</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-view="dashboard"><span class="nav-icon">📊</span> 대시보드</button>
      <button class="nav-item" data-view="players"><span class="nav-icon">👥</span> 선수 관리</button>
      <button class="nav-item" data-view="matches"><span class="nav-icon">📅</span> 경기 일정</button>
      <button class="nav-item" data-view="positions"><span class="nav-icon">📌</span> 포지션</button>
    </nav>
    <div class="sidebar-footer">백마FC v1.0</div>
  </aside>

  <!-- ===== MAIN WRAPPER ===== -->
  <div class="main-wrapper">

    <!-- Header -->
    <header class="main-header">
      <div style="display:flex;align-items:center;gap:0.75rem;">
        <button class="mobile-toggle" id="mobileToggle" aria-label="메뉴">☰</button>
        <h2 id="pageTitle">백마FC 대시보드</h2>
      </div>
      <div class="header-actions">
        <span class="badge" id="playerCountBadge">👥 0명</span>
        <span class="badge" id="matchCountBadge">📅 0경기</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
      <!-- Content will be rendered by JS -->
    </main>
  </div>

  <!-- ===== MODAL ===== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent">
      <h3 id="modalTitle">제목</h3>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button class="btn btn-outline btn-sm" id="modalCancel">취소</button>
        <button class="btn btn-primary btn-sm" id="modalConfirm">확인</button>
      </div>
    </div>
  </div>

  <!-- ===== TOAST CONTAINER ===== -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    // ========================================================================
    // DATA STORE (localStorage based)
    // ========================================================================
    const STORE_KEY = 'fc_manager_data';

    let store = {
      players: [],
      matches: [],
      positions: [
        { id: 'gk', label: 'GK', name: '골키퍼', count: 0 },
        { id: 'df', label: 'DF', name: '수비수', count: 0 },
        { id: 'mf', label: 'MF', name: '미드필더', count: 0 },
        { id: 'fw', label: 'FW', name: '공격수', count: 0 }
      ]
    };

    function loadStore() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          store = parsed;
        } else {
          seedData();
        }
      } catch(e) { seedData(); }
      updatePositionCounts();
      saveStore();
    }

    function saveStore() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e) {}
    }

    function seedData() {
      store.players = [
        { id: 'p1', name: '김민재', number: 4, position: 'DF', age: 28, height: 188, weight: 82, nationality: '대한민국', status: 'active', notes: '백마FC 주력 수비수' },
        { id: 'p2', name: '이강인', number: 10, position: 'MF', age: 22, height: 173, weight: 65, nationality: '대한민국', status: 'active', notes: '공격형 미드필더, 백마FC 에이스' },
        { id: 'p3', name: '손흥민', number: 7, position: 'FW', age: 32, height: 183, weight: 78, nationality: '대한민국', status: 'active', notes: '백마FC 주력 공격수' },
        { id: 'p4', name: '조현우', number: 1, position: 'GK', age: 32, height: 187, weight: 85, nationality: '대한민국', status: 'active', notes: '수석 골키퍼' },
        { id: 'p5', name: '황희찬', number: 22, position: 'FW', age: 27, height: 177, weight: 72, nationality: '대한민국', status: 'injured', notes: '부상 회복 중, 백마FC 영건' },
        { id: 'p6', name: '김지호', number: 2, position: 'DF', age: 24, height: 180, weight: 70, nationality: '대한민국', status: 'active', notes: '센터백' },
        { id: 'p7', name: '박지수', number: 25, position: 'MF', age: 30, height: 176, weight: 70, nationality: '대한민국', status: 'retired', notes: '은퇴, 백마FC 레전드' },
        { id: 'p8', name: '정우영', number: 8, position: 'MF', age: 23, height: 170, weight: 60, nationality: '대한민국', status: 'active', notes: '크리에이티브 미드필더' },
      ];
      store.matches = [
        { id: 'm1', name: '백마FC 홈 경기 vs 수원FC', date: '2026-07-25', location: '홈구장', opponent: '수원FC', home: true, status: 'scheduled', players: ['p3','p2','p1','p6','p8'] },
        { id: 'm2', name: '백마FC 원정 경기 vs 인천UTD', date: '2026-08-01', location: '인천문학경기장', opponent: '인천UTD', home: false, status: 'scheduled', players: ['p4','p1','p6','p8','p3'] },
      ];
      updatePositionCounts();
      saveStore();
    }

    function updatePositionCounts() {
      const activePlayers = store.players.filter(p => p.status === 'active');
      store.positions.forEach(pos => {
        pos.count = activePlayers.filter(p => p.position === pos.id).length;
      });
    }

    // ========================================================================
    // STATE
    // ========================================================================
    let currentView = 'dashboard';
    let editingPlayerId = null;
    let editingMatchId = null;
    let searchQuery = '';

    // ========================================================================
    // HELPERS
    // ========================================================================
    function getPlayer(id) { return store.players.find(p => p.id === id); }
    function getMatch(id) { return store.matches.find(m => m.id === id); }
    function getPosition(id) { return store.positions.find(p => p.id === id); }

    function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function statusLabel(status) {
      const map = { active: '활동', injured: '부상', retired: '은퇴', inactive: '비활동', scheduled: '예정', played: '경기완료', home: '홈', away: '원정' };
      return map[status] || status;
    }

    function getPlayerInitials(name) { return name.charAt(0); }

    // ========================================================================
    // TOAST
    // ========================================================================
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = '0.3s'; el.style.transform = 'translateX(20px)'; setTimeout(() => el.remove(), 300); }, 3000);
    }

    // ========================================================================
    // RENDER: DASHBOARD
    // ========================================================================
    function renderDashboard() {
      currentView = 'dashboard';
      document.getElementById('pageTitle').textContent = '백마FC 대시보드';
      document.getElementById('mainContent').innerHTML = `
        <div class="stats-grid" id="statsGrid">
          <div class="stat-card"><div class="stat-number" id="statPlayers">0</div><div class="stat-label">총 선수</div></div>
          <div class="stat-card"><div class="stat-number" id="statActive">0</div><div class="stat-label">활동 선수</div></div>
          <div class="stat-card"><div class="stat-number" id="statMatches">0</div><div class="stat-label">총 경기</div></div>
          <div class="stat-card"><div class="stat-number" id="statPositions">0</div><div class="stat-label">포지션</div></div>
        </div>
        <div class="card">
          <div class="card-header"><h3>📅 다가오는 경기</h3><span class="text-muted">총 ${store.matches.length}경기</span></div>
          <div id="upcomingMatches"></div>
        </div>
        <div class="card mt-2">
          <div class="card-header"><h3>👥 활동 선수 목록</h3><span class="text-muted">${store.players.filter(p=>p.status==='active').length}명</span></div>
          <div id="dashboardPlayerList"></div>
        </div>
      `;
      renderStats();
      renderUpcomingMatches();
      renderDashboardPlayers();
      updateNav('dashboard');
    }

    function renderStats() {
      const players = store.players;
      const active = players.filter(p => p.status === 'active');
      const matches = store.matches;
      document.getElementById('statPlayers').textContent = players.length;
      document.getElementById('statActive').textContent = active.length;
      document.getElementById('statMatches').textContent = matches.length;
      document.getElementById('statPositions').textContent = store.positions.length;
      document.getElementById('playerCountBadge').textContent = `👥 ${players.length}명`;
      document.getElementById('matchCountBadge').textContent = `📅 ${matches.length}경기`;
    }

    function renderUpcomingMatches() {
      const sorted = [...store.matches].sort((a,b) => a.date.localeCompare(b.date));
      const container = document.getElementById('upcomingMatches');
      if (sorted.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>예정된 경기가 없습니다.</p></div>';
        return;
      }
      container.innerHTML = sorted.map(m => `
        <div class="match-list-item" style="cursor:pointer;" data-match-id="${m.id}" onclick="navigateToMatchDetail('${m.id}')">
          <div class="match-info">
            <div class="date">${formatDate(m.date)}</div>
            <div class="vs">vs ${m.opponent}</div>
            <div style="font-size:0.8rem;color:var(--text-light);">${m.location} · ${m.home ? '홈' : '원정'}</div>
          </div>
          <div style="display:flex;align-items:center;gap:1rem;">
            <span class="match-status" style="${m.status==='scheduled'?'background:#e0f2f1;color:#00796b':''}">${statusLabel(m.status)}</span>
            <span class="text-muted text-muted" style="font-size:0.8rem;">⚽ ${(m.players||[]).filter(id=>getPlayer(id)).length}명 배정</span>
          </div>
        </div>
      `).join('');
    }

    function renderDashboardPlayers() {
      const active = store.players.filter(p => p.status === 'active');
      const container = document.getElementById('dashboardPlayerList');
      if (active.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>활동 선수가 없습니다.</p></div>';
        return;
      }
      container.innerHTML = `
        <div class="player-grid">
          ${active.map(p => `
            <div class="player-card" onclick="navigateToPlayerDetail('${p.id}')" style="cursor:pointer;">
              <div class="player-avatar" style="background:var(--primary-light);">
                ${getPlayerInitials(p.name)}
                <span class="position-badge">${p.position.toUpperCase()}</span>
              </div>
              <div class="player-body">
                <h4>${p.name}</h4>
                <div class="player-info">
                  <span>👕 #${p.number}</span>
                  <span>📏 ${p.height}cm / ${p.weight}kg</span>
                  <span>🎂 ${p.age}세</span>
                  <span class="position-tag pos-${p.position}">${p.position.toUpperCase()}</span>
                </div>
                <p class="text-muted" style="font-size:0.8rem;margin-top:0.25rem;">${p.nationality}</p>
              </div>
            </div>
          `)}
        </div>
      `;
    }

    // ========================================================================
    // RENDER: PLAYERS
    // ========================================================================
    function renderPlayers() {
      currentView = 'players';
      document.getElementById('pageTitle').textContent = '선수 관리';
      const container = document.getElementById('mainContent');
      container.innerHTML = `
        <div class="card">
          <div class="card-header">
            <h3>👥 선수 목록</h3>
            <div class="actions">
              <input type="text" id="playerSearch" placeholder="🔍 선수 검색..." style="padding:0.4rem 0.75rem;font-size:0.85rem;">
              <button class="btn btn-accent btn-sm" onclick="addPlayerFromDashboard()">➕ 선수 추가</button>
            </div>
          </div>
          <div id="playerListContainer">
            ${renderPlayerTable()}
          </div>
        </div>
      `;
      updateNav('players');
    }

    function renderPlayerTable() {
      let list = [...store.players];
      if (searchQuery) {
        list = list.filter(p => p.name.toLowerCase().includes(searchQuery.toLowerCase()));
      }
      if (list.length === 0) {
        return `<div class="empty-state"><div class="empty-icon">🏃</div><p>등록된 선수가 없습니다.</p></div>`;
      }
      return `
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>번호</th><th>이름</th><th>포지션</th><th>나이</th><th>신장</th><th>상태</th><th>관리</th>
            </tr></thead>
            <tbody>
              ${list.map(p => `
                <tr>
                  <td>#${p.number}</td>
                  <td><strong>${p.name}</strong></td>
                  <td><span class="position-tag pos-${p.position}">${p.position.toUpperCase()}</span></td>
                  <td>${p.age}세</td>
                  <td>${p.height}cm / ${p.weight}kg</td>
                  <td><span class="status status-${p.status}">${statusLabel(p.status)}</span></td>
                  <td>
                    <button class="btn btn-outline btn-sm" onclick="navigateToPlayerDetail('${p.id}')">상세</button>
                    <button class="btn btn-outline btn-sm" onclick="editPlayer('${p.id}')">수정</button>
                    <button class="btn btn-danger btn-sm" onclick="deletePlayer('${p.id}')">삭제</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // ========================================================================
    // RENDER: MATCHES
    // ========================================================================
    function renderMatches() {
      currentView = 'matches';
      document.getElementById('pageTitle').textContent = '경기 일정';
      const container = document.getElementById('mainContent');
      container.innerHTML = `
        <div class="card">
          <div class="card-header">
            <h3>📅 경기 일정</h3>
            <div class="actions">
              <button class="btn btn-accent btn-sm" onclick="addMatchFromDashboard()">➕ 새 경기</button>
            </div>
          </div>
          <div id="matchListContainer">
            ${renderMatchList()}
          </div>
        </div>
      `;
      updateNav('matches');
    }

    function renderMatchList() {
      const list = [...store.matches].sort((a,b) => a.date.localeCompare(b.date));
      if (list.length === 0) {
        return `<div class="empty-state"><div class="empty-icon">📅</div><p>등록된 경기가 없습니다.</p></div>`;
      }
      return `
        <div class="table-wrap">
          <table>
            <thead><tr><th>날짜</th><th>경기명</th><th>상대</th><th>장소</th><th>상태</th><th>배정 선수</th><th>관리</th></tr></thead>
            <tbody>
              ${list.map(m => `
                <tr onclick="navigateToMatchDetail('${m.id}')" style="cursor:pointer;">
                  <td>${formatDate(m.date)}</td>
                  <td><strong>${m.name}</strong></td>
                  <td>vs ${m.opponent}</td>
                  <td>${m.location}</td>
                  <td><span class="status status-${m.status}">${statusLabel(m.status)}</span></td>
                  <td>${(m.players||[]).filter(id=>getPlayer(id)).length}명</td>
                  <td>
                    <button class="btn btn-outline btn-sm" onclick="navigateToMatchDetail('${m.id}')">상세</button>
                    <button class="btn btn-outline btn-sm" onclick="editMatch('${m.id}')">수정</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteMatch('${m.id}')">삭제</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // ========================================================================
    // RENDER: POSITIONS
    // ========================================================================
    function renderPositions() {
      currentView = 'positions';
      document.getElementById('pageTitle').textContent = '포지션 관리';
      const container = document.getElementById('mainContent');
      container.innerHTML = `
        <div class="card">
          <div class="card-header">
            <h3>📌 포지션 설정</h3>
            <div class="actions">
              <button class="btn btn-accent btn-sm" onclick="addPosition()">➕ 포지션 추가</button>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;">
            ${store.positions.map(pos => {
              const players = store.players.filter(p => p.position === pos.id && p.status === 'active');
              return `
                <div class="card" style="padding:1rem;">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
                    <span class="position-tag pos-${pos.id}">${pos.label}</span>
                    <span style="font-size:0.8rem;color:var(--text-light);">${pos.count}명</span>
                  </div>
                  <p class="text-muted" style="font-size:0.85rem;">${pos.name}</p>
                  <div style="margin-top:0.75rem;">
                    <button class="btn btn-outline btn-sm" onclick="editPosition('${pos.id}')">수정</button>
                    <button class="btn btn-danger btn-sm" onclick="deletePosition('${pos.id}')">삭제</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
      updateNav('positions');
    }

    // ========================================================================
    // NAVIGATION
    // ========================================================================
    function navigateTo(view) {
      currentView = view;
      if (view === 'dashboard') renderDashboard();
      else if (view === 'players') renderPlayers();
      else if (view === 'matches') renderMatches();
      else if (view === 'positions') renderPositions();
      updateNav(view);
      closeMobileMenu();
    }

    function updateNav(view) {
      document.querySelectorAll('.sidebar-nav .nav-item').forEach(el => {
        el.classList.toggle('active', el.dataset.view === view);
      });
    }

    function navigateToPlayerDetail(id) {
      editingPlayerId = id;
      renderPlayerDetail();
    }

    function navigateToMatchDetail(id) {
      editingMatchId = id;
      renderMatchDetail();
    }

    function editPlayer(id) {
      editingPlayerId = id;
      showPlayerForm();
    }

    function editMatch(id) {
      editingMatchId = id;
      showMatchForm();
    }

    function addPlayerFromDashboard() {
      editingPlayerId = null;
      showPlayerForm();
    }

    function addMatchFromDashboard() {
      editingMatchId = null;
      showMatchForm();
    }

    function closeMobileMenu() {
      document.getElementById('sidebar').classList.remove('open');
    }

    // ========================================================================
    // MODAL: PLAYER FORM
    // ========================================================================
    function showPlayerForm() {
      const player = editingPlayerId ? getPlayer(editingPlayerId) : null;
      document.getElementById('modalTitle').textContent = player ? '✏️ 선수 수정' : '➕ 새 선수 등록';
      const body = document.getElementById('modalBody');
      body.innerHTML = `
        <div class="form-grid">
          <div class="form-group">
            <label>이름 *</label>
            <input type="text" id="playerFormName" value="${player ? player.name : ''}" placeholder="선수 이름">
          </div>
          <div class="form-group">
            <label>등번호 *</label>
            <input type="number" id="playerFormNumber" min="1" max="99" value="${player ? player.number : ''}" placeholder="1~99">
          </div>
          <div class="form-group">
            <label>포지션 *</label>
            <select id="playerFormPosition">
              ${store.positions.map(p => `<option value="${p.id}" ${player && player.position === p.id ? 'selected' : ''}>${p.label} - ${p.name}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label>나이 *</label>
            <input type="number" id="playerFormAge" min="15" max="50" value="${player ? player.age : ''}" placeholder="나이">
          </div>
          <div class="form-group">
            <label>신장 (cm) *</label>
            <input type="number" id="playerFormHeight" min="150" max="220" value="${player ? player.height : ''}" placeholder="150~220">
          </div>
          <div class="form-group">
            <label>체중 (kg) *</label>
            <input type="number" id="playerFormWeight" min="45" max="130" value="${player ? player.weight : ''}" placeholder="45~130">
          </div>
          <div class="form-group">
            <label>국적</label>
            <input type="text" id="playerFormNationality" value="${player ? player.nationality : ''}" placeholder="대한민국">
          </div>
          <div class="form-group">
            <label>상태</label>
            <select id="playerFormStatus">
              <option value="active" ${!player || player.status==='active'?'selected':''}>활동</option>
              <option value="injured" ${player && player.status==='injured'?'selected':''}>부상</option>
              <option value="retired" ${player && player.status==='retired'?'selected':''}>은퇴</option>
              <option value="inactive" ${player && player.status==='inactive'?'selected':''}>비활동</option>
            </select>
          </div>
          <div class="form-group full-width">
            <label>메모</label>
            <textarea id="playerFormNotes" placeholder="추가 정보...">${player ? player.notes : ''}</textarea>
          </div>
        </div>
        <input type="hidden" id="playerFormId" value="${player ? player.id : ''}">
      `;
      document.getElementById('modalConfirm').textContent = player ? '✏️ 수정 완료' : '✅ 등록 완료';
      document.getElementById('modalCancel').textContent = '취소';
      openModal('playerForm');
    }

    function openModal(type) {
      const overlay = document.getElementById('modalOverlay');
      overlay.classList.add('open');
      overlay.dataset.type = type;
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
    }

    function handleModalConfirm() {
      const type = document.getElementById('modalOverlay').dataset.type;
      if (type === 'playerForm') {
        handlePlayerFormSubmit();
      }
      closeModal();
    }

    function handlePlayerFormSubmit() {
      const id = document.getElementById('playerFormId').value;
      const name = document.getElementById('playerFormName').value.trim();
      const number = parseInt(document.getElementById('playerFormNumber').value);
      const position = document.getElementById('playerFormPosition').value;
      const age = parseInt(document.getElementById('playerFormAge').value);
      const height = parseInt(document.getElementById('playerFormHeight').value);
      const weight = parseInt(document.getElementById('playerFormWeight').value);
      const nationality = document.getElementById('playerFormNationality').value.trim();
      const status = document.getElementById('playerFormStatus').value;
      const notes = document.getElementById('playerFormNotes').value.trim();

      if (!name || !number || !position || !age || !height || !weight) {
        showToast('필수 항목을 모두 입력해주세요.', 'error');
        return;
      }

      if (id) {
        const idx = store.players.findIndex(p => p.id === id);
        if (idx !== -1) {
          store.players[idx] = { ...store.players[idx], name, number, position, age, height, weight, nationality, status, notes };
          showToast('선수 정보가 수정되었습니다.', 'success');
        }
      } else {
        const newPlayer = {
          id: generateId(),
          name,
          number,
          position,
          age,
          height,
          weight,
          nationality: nationality || '대한민국',
          status: status || 'active',
          notes
        };
        store.players.push(newPlayer);
        showToast('새 선수가 등록되었습니다.', 'success');
      }
      saveStore();
      if (editingPlayerId) {
        editingPlayerId = newPlayer.id || id;
        renderPlayerDetail();
      } else {
        renderPlayers();
      }
    }

    // ========================================================================
    // MODAL: MATCH FORM
    // ========================================================================
    function showMatchForm() {
      const match = editingMatchId ? getMatch(editingMatchId) : null;
      const availablePlayers = store.players.filter(p => p.status === 'active');
      document.getElementById('modalTitle').textContent = match ? '✏️ 경기 수정' : '➕ 새 경기 등록';
      const body = document.getElementById('modalBody');
      body.innerHTML = `
        <div class="form-grid">
          <div class="form-group">
            <label>경기명 *</label>
            <input type="text" id="matchFormName" value="${match ? match.name : ''}" placeholder="예: 백마FC 홈 경기 vs 라이벌">
          </div>
          <div class="form-group">
            <label>상대팀 *</label>
            <input type="text" id="matchFormOpponent" value="${match ? match.opponent : ''}" placeholder="상대팀 이름">
          </div>
          <div class="form-group">
            <label>날짜 *</label>
            <input type="date" id="matchFormDate" value="${match ? match.date : formatDate(new Date(Date.now() + 86400000 * 7))}">
          </div>
          <div class="form-group">
            <label>장소 *</label>
            <input type="text" id="matchFormLocation" value="${match ? match.location : ''}" placeholder="경기장 이름">
          </div>
          <div class="form-group">
            <label>홈/원정</label>
            <select id="matchFormHome">
              <option value="true" ${match && match.home===true?'selected':''}>홈 경기</option>
              <option value="false" ${match && match.home===false?'selected':''}>원정 경기</option>
            </select>
          </div>
          <div class="form-group">
            <label>배정 선수</label>
            <div style="max-height:120px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:0.4rem;" id="matchPlayerList">
              ${availablePlayers.length === 0 ? '<p class="text-muted">배정할 활동 선수가 없습니다.</p>' : availablePlayers.map(p => {
                const assigned = match ? match.players.includes(p.id) : false;
                return `<div style="display:flex;justify-content:space-between;align-items:center;padding:0.2rem 0.4rem;border-radius:4px;margin-bottom:2px;font-size:0.8rem;background:${assigned?'#ebf4ff':'transparent'};">
                  <span>${p.name} (#${p.number})</span>
                  <button class="btn ${assigned?'btn-danger btn-sm':'btn-success btn-sm'}" onclick="toggleMatchPlayer('${p.id}','${match ? match.id : 'new'}')">${assigned?'제외':'배정'}</button>
                </div>`;
              }).join('')}
            </div>
          </div>
        </div>
        <input type="hidden" id="matchFormId" value="${match ? match.id : ''}">
      `;
      document.getElementById('modalConfirm').textContent = match ? '✏️ 수정 완료' : '✅ 등록 완료';
      document.getElementById('modalCancel').textContent = '취소';
      openModal('matchForm');
    }

    function toggleMatchPlayer(playerId, matchId) {
      if (matchId === 'new') {
        showToast('경기를 먼저 저장한 후 선수를 배정해주세요.', 'warning');
        return;
      }
      const match = getMatch(matchId);
      if (match) {
        const idx = match.players.indexOf(playerId);
        if (idx !== -1) {
          match.players.splice(idx, 1);
          showToast('선수가 배정에서 제외되었습니다.', 'success');
        } else {
          match.players.push(playerId);
          showToast('선수가 배정되었습니다.', 'success');
        }
        saveStore();
        if (editingMatchId === matchId) renderMatchDetail();
      }
    }

    function handleMatchFormSubmit() {
      const id = document.getElementById('matchFormId').value;
      const name = document.getElementById('matchFormName').value.trim();
      const opponent = document.getElementById('matchFormOpponent').value.trim();
      const date = document.getElementById('matchFormDate').value;
      const location = document.getElementById('matchFormLocation').value.trim();
      const home = document.getElementById('matchFormHome').value === 'true';

      if (!name || !opponent || !date || !location) {
        showToast('필수 항목을 모두 입력해주세요.', 'error');
        return;
      }

      if (id) {
        const idx = store.matches.findIndex(m => m.id === id);
        if (idx !== -1) {
          store.matches[idx] = { ...store.matches[idx], name, opponent, date, location, home };
          showToast('경기 정보가 수정되었습니다.', 'success');
        }
      } else {
        const newMatch = {
          id: generateId(),
          name,
          opponent,
          date,
          location,
          home,
          status: 'scheduled',
          players: []
        };
        store.matches.push(newMatch);
        showToast('새 경기가 등록되었습니다.', 'success');
        editingMatchId = newMatch.id;
      }
      saveStore();
      if (editingMatchId) {
        const targetId = id || (store.matches.length > 0 ? store.matches[store.matches.length-1].id : null);
        if (targetId) renderMatchDetail();
        else renderMatches();
      } else {
        renderMatches();
      }
    }

    // ========================================================================
    // PLAYER DETAIL
    // ========================================================================
    function renderPlayerDetail() {
      const player = editingPlayerId ? getPlayer(editingPlayerId) : null;
      if (!player) {
        renderPlayers();
        return;
      }
      document.getElementById('pageTitle').textContent = `${player.name} - 선수 프로필`;
      document.getElementById('mainContent').innerHTML = `
        <div class="card" style="max-width:700px;">
          <div class="player-card" style="border:none;box-shadow:none;">
            <div class="player-avatar" style="background:var(--primary-light);">
              ${getPlayerInitials(player.name)}
              <span class="position-badge">${player.position.toUpperCase()} #{player.number}</span>
            </div>
            <div class="player-body" style="padding:1.25rem;">
              <h4 style="font-size:1.3rem;">${player.name}</h4>
              <div class="position-tags mt-1">
                <span class="position-tag pos-${player.position}">${player.position.toUpperCase()} ${getPosition(player.position)?.name || ''}</span>
                <span style="padding:0.15rem 0.5rem;background:var(--bg);border-radius:4px;">👕 #${player.number}</span>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:1.25rem;margin:1rem 0;padding:1rem 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);">
                <div><strong>나이</strong><br>${player.age}세</div>
                <div><strong>신장</strong><br>${player.height}cm</div>
                <div><strong>체중</strong><br>${player.weight}kg</div>
                <div><strong>국적</strong><br>${player.nationality}</div>
                <div><strong>상태</strong><br><span class="status status-${player.status}">${statusLabel(player.status)}</span></div>
              </div>
              ${player.notes ? `<p class="text-muted" style="font-style:italic;">📝 ${player.notes}</p>` : ''}
              <div class="player-actions">
                <button class="btn btn-accent" onclick="navigateToPlayers()">← 목록</button>
                <button class="btn btn-outline" onclick="editPlayer('${player.id}')">✏️ 수정</button>
                <button class="btn btn-danger" onclick="deletePlayer('${player.id}')">🗑️ 삭제</button>
              </div>
            </div>
          </div>
        </div>
      `;
      document.getElementById('mainContent').style.opacity = '0';
      setTimeout(() => { document.getElementById('mainContent').style.opacity = '1'; }, 100);
      updateNav('players');
      closeMobileMenu();
    }

    // ========================================================================
    // MATCH DETAIL
    // ========================================================================
    function renderMatchDetail() {
      const match = editingMatchId ? getMatch(editingMatchId) : null;
      if (!match) {
        renderMatches();
        return;
      }
      document.getElementById('pageTitle').textContent = `${match.name} - 경기 상세`;
      const players = [...(match.players || [])].map(id => getPlayer(id)).filter(Boolean);
      const allActive = store.players.filter(p => p.status === 'active');

      const positions = ['GK', 'DF', 'DF', 'DF', 'MF', 'MF', 'MF', 'FW', 'FW', 'FW', 'FW'];
      const positionMap = {};
      positions.forEach((pos, idx) => {
        positionMap[`field-${idx}`] = pos;
      });

      const fieldCells = [];
      for (let i = 0; i < 11; i++) {
        const assigned = players.find(p => p.position === positionMap[`field-${i}`]);
        fieldCells.push(assigned ? assigned : null);
      }

      const subs = allActive.filter(p => !players.includes(p));

      document.getElementById('mainContent').innerHTML = `
        <div class="card" style="max-width:800px;">
          <div class="card-header">
            <div><h3 style="font-size:1.1rem;">${match.name}</h3><span class="text-muted" style="font-size:0.85rem;">vs ${match.opponent} · ${match.location}</span></div>
            <div class="actions">
              <button class="btn btn-accent btn-sm" onclick="editMatch('${match.id}')">✏️ 수정</button>
              <button class="btn btn-danger btn-sm" onclick="deleteMatch('${match.id}')">🗑️ 삭제</button>
            </div>
          </div>

          <div style="display:flex;gap:2rem;flex-wrap:wrap;margin-bottom:1rem;padding:0.75rem 0;border-bottom:1px solid var(--border);">
            <div><strong>📅 날짜</strong> ${formatDate(match.date)}</div>
            <div><strong>🏠 홈/원정</strong> ${match.home?'홈':'원정'}</div>
            <div><strong>⚽ 배정 선수</strong> ${players.length}/${positions.length}명</div>
          </div>

          <div style="margin-bottom:1.5rem;">
            <div style="font-size:0.8rem;color:var(--text-light);margin-bottom:0.5rem;text-align:center;">백마FC 포메이션 (11명)</div>
            <div class="field-grid" id="fieldGrid">
              ${fieldCells.map((cell, idx) => {
                const pos = positionMap[`field-${idx}`];
                if (!cell) {
                  return `<div class="empty-cell">${pos.toUpperCase()}</div>`;
                }
                const isGK = pos === 'GK';
                return `<div class="player-cell" style="background:${isGK?'#e0f2f1':'transparent'};">
                  <span class="p-name">${cell.name}</span>
                  <span class="p-num">#${cell.number}</span>
                  <span class="p-pos pos-${cell.position}">${cell.position.toUpperCase()}</span>
                  <div class="p-actions">
                    <button class="btn btn-danger btn-sm" onclick="removePlayerFromMatch('${match.id}','${cell.id}')">✕</button>
                  </div>
                </div>`;
              }).join('')}
            </div>
          </div>

          <div class="card-header" style="margin-bottom:1rem;">
            <h3>➕ 선수 추가 배정</h3>
            <span class="text-muted">${subs.length}명 가능</span>
          </div>
          ${subs.length === 0 ? '<p class="text-muted">추가 배정 가능한 활동 선수가 없습니다.</p>' : `
            <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
              ${subs.map(p => `
                <div style="display:flex;align-items:center;gap:0.4rem;padding:0.3rem 0.7rem;background:var(--bg);border-radius:var(--radius-sm);">
                  <span>${p.name} (#${p.number}) - ${p.position.toUpperCase()}</span>
                  <button class="btn btn-success btn-sm" onclick="addPlayerToMatch('${match.id}','${p.id}')">배정</button>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
      updateNav('matches');
      closeMobileMenu();
    }

    function addPlayerToMatch(matchId, playerId) {
      const match = getMatch(matchId);
      if (match && !match.players.includes(playerId)) {
        match.players.push(playerId);
        saveStore();
        showToast(`${getPlayer(playerId).name} 선수가 배정되었습니다.`, 'success');
        renderMatchDetail();
      }
    }

    function removePlayerFromMatch(matchId, playerId) {
      const match = getMatch(matchId);
      if (match) {
        const idx = match.players.indexOf(playerId);
        if (idx !== -1) {
          match.players.splice(idx, 1);
          saveStore();
          showToast('선수가 배정에서 제외되었습니다.', 'success');
          renderMatchDetail();
        }
      }
    }

    // ========================================================================
    // CRUD OPERATIONS
    // ========================================================================
    function deletePlayer(id) {
      if (!confirm('정말 이 선수를 삭제하시겠습니까?')) return;
      store.players = store.players.filter(p => p.id !== id);
      store.matches.forEach(m => { m.players = m.players.filter(pid => pid !== id); });
      saveStore();
      showToast('선수가 삭제되었습니다.', 'success');
      if (editingPlayerId === id) renderPlayers();
      else renderPlayers();
    }

    function deleteMatch(id) {
      if (!confirm('정말 이 경기를 삭제하시겠습니까?')) return;
      store.matches = store.matches.filter(m => m.id !== id);
      saveStore();
      showToast('경기가 삭제되었습니다.', 'success');
      if (editingMatchId === id) renderMatches();
      else renderMatches();
    }

    function addPosition() {
      showToast('포지션 수정은 직접 관리해주세요.', 'warning');
    }

    // ========================================================================
    // EVENT LISTENERS
    // ========================================================================
    document.addEventListener('DOMContentLoaded', () => {
      loadStore();
      renderDashboard();

      // Navigation
      document.querySelectorAll('.sidebar-nav .nav-item').forEach(el => {
        el.addEventListener('click', () => {
          navigateTo(el.dataset.view);
        });
      });

      // Mobile toggle
      document.getElementById('mobileToggle').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('open');
      });

      // Close sidebar on nav click (mobile)
      document.querySelectorAll('.sidebar-nav .nav-item').forEach(el => {
        el.addEventListener('click', () => {
          if (window.innerWidth <= 768) closeMobileMenu();
        });
      });

      // Modal handlers
      document.getElementById('modalCancel').addEventListener('click', closeModal);
      document.getElementById('modalConfirm').addEventListener('click', handleModalConfirm);
      document.getElementById('modalOverlay').addEventListener('click', (e) => {
        if (e.target === document.getElementById('modalOverlay')) closeModal();
      });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

      // Search
      document.getElementById('playerSearch')?.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderPlayerTable();
      });
    });

    // Expose functions to global scope for inline onclick handlers
    window.navigateTo = navigateTo;
    window.navigateToPlayerDetail = navigateToPlayerDetail;
    window.navigateToMatchDetail = navigateToMatchDetail;
    window.addPlayerFromDashboard = addPlayerFromDashboard;
    window.addMatchFromDashboard = addMatchFromDashboard;
    window.editPlayer = editPlayer;
    window.editMatch = editMatch;
    window.deletePlayer = deletePlayer;
    window.deleteMatch = deleteMatch;
    window.addPlayerToMatch = addPlayerToMatch;
    window.removePlayerFromMatch = removePlayerFromMatch;
    window.toggleMatchPlayer = toggleMatchPlayer;
    window.showPlayerForm = showPlayerForm;
    window.showMatchForm = showMatchForm;
    window.renderPlayerDetail = renderPlayerDetail;
    window.renderMatchDetail = renderMatchDetail;
    window.handlePlayerFormSubmit = handlePlayerFormSubmit;
    window.handleMatchFormSubmit = handleMatchFormSubmit;
  </script>
</body>
</html>
